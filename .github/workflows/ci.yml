name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: go/go.sum

      - name: Install a2acli
        run: |
          go install github.com/ghchinoy/a2acli/cmd/a2acli@latest
          a2acli version

      - name: Verify Go build, vet & test
        working-directory: ./go
        run: |
          go build ./...
          go vet ./...
          go test -v ./...
